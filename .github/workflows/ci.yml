name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 26.04 has no Python 3.9 build in actions/setup-python; keep testing the minimum.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'setuptools>=68' wheel
      - run: make check
