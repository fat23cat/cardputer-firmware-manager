[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardputer-firmware-manager"
version = "0.1.0"
description = "Host-side CRUB firmware bundle manager for M5Stack Cardputer ADV"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "fat23cat"}]
dependencies = []

[project.scripts]
cardputer-firmware = "firmware_manager.cli:main"

[tool.setuptools]
packages = ["firmware_manager"]
